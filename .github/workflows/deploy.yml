name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Vite only transpiles, so without this a type error ships a white
      # screen. This is exactly how the site went down on 2026-08-01.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # A green build is not proof the site renders. Catch a crashed app
      # before anyone else does.
      - name: Smoke test the live site
        run: |
          sleep 20
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 "https://cohereboulder.org/?ci=${GITHUB_SHA}" || true)
            if printf '%s' "$body" | grep -q "<div id=\"root\">"; then
              echo "Homepage served."
              break
            fi
            echo "Attempt $attempt: homepage not ready, retrying…"
            sleep 15
          done

          # The app renders client-side, so assert on what the served HTML must
          # contain rather than on rendered text.
          printf '%s' "$body" | grep -q "<div id=\"root\">" \
            || { echo "::error::Homepage did not serve the app shell"; exit 1; }
          printf '%s' "$body" | grep -qi "Something went wrong" \
            && { echo "::error::Error boundary is being served — the app crashed on mount"; exit 1; }
          echo "Smoke test passed."
