name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Vite only transpiles, so without this a type error ships a white
      # screen. This is exactly how the site went down on 2026-08-01.
      - name: Type check
        run: npm run typecheck

      # The site defaults to same-origin, which is right once the Worker serves
      # the domain. While GitHub Pages still serves it, the API lives elsewhere
      # and has to be addressed absolutely. Delete this env block (and this
      # whole workflow) after the Cloudflare cutover.
      - name: Build
        env:
          VITE_SIGNUP_URL: https://cohere-signup.unforced.workers.dev
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # A green build is not proof the site renders. The app mounts
      # client-side, so the served HTML is identical whether it works or
      # throws — only a real browser can tell the difference.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the live site
        run: |
          sleep 20
          npm run smoke -- https://cohereboulder.org
