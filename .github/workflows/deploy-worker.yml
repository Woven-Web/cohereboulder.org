name: Deploy Cloudflare Worker

# This is the only deploy path. The Worker serves cohereboulder.org itself —
# the site, the API, the admin portal, and unsubscribe — so without this
# workflow nothing reaches production except from a machine with
# `wrangler login`.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — Cloudflare dashboard → My Profile → API Tokens →
#                            "Edit Cloudflare Workers" template, scoped to the
#                            Unforced Development account. Needs Workers
#                            Scripts: Edit, Workers KV: Edit, D1: Edit.
#   CLOUDFLARE_ACCOUNT_ID  — 8f2a7eb9d5e21ffa902a76cf62975c82
#
# Until those exist the job is skipped rather than failing every push.
#
# One more secret is UPLOADED rather than used here:
#   REGENOS_SERVICE_TOKEN  — the regenOS agent token the Worker writes calendar
#                            events with (worker/src/regenos-service.ts). The
#                            wrangler-action `secrets:` input pushes it to the
#                            Worker as a secret of the same name, so it is set
#                            on every deploy and never lives in wrangler.jsonc.
#                            Rotating it is a GitHub-secret edit plus a re-run;
#                            see the Event management section in CLAUDE.md.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "worker"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the Worker deploy. Add it in Settings → Secrets to enable automatic deploys."
          fi

      - name: Setup Node.js
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        run: npm ci

      - name: Type check
        if: steps.creds.outputs.present == 'true'
        run: npm run typecheck

      - name: Build the site
        if: steps.creds.outputs.present == 'true'
        run: npm run build

      # Migrate before deploying, so the new Worker never runs against the old
      # schema. Wrangler tracks applied migrations in a d1_migrations table it
      # creates on first use, so this is a no-op when there is nothing new.
      - name: Apply D1 migrations
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply cohere --remote

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        # `secrets:` names environment variables for the action to upload as
        # Worker secrets, so the value has to be in the env — never inlined
        # into a `run:` line, where it would land in the build log.
        env:
          REGENOS_SERVICE_TOKEN: ${{ secrets.REGENOS_SERVICE_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action bundles wrangler 3.x, which cannot read wrangler.jsonc
          # and fails with "Missing entry-point". Keep this matching the
          # devDependency in package.json.
          wranglerVersion: "4.118.0"
          secrets: |
            REGENOS_SERVICE_TOKEN

      - name: Install Chromium
        if: steps.creds.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Smoke test the Worker
        if: steps.creds.outputs.present == 'true'
        run: |
          sleep 15
          base="https://cohereboulder.org"
          for path in /api/form/register-2026 /admin; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$base$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          # The Worker serves the site too, so check that it renders.
          npm run smoke -- "$base"
          npm run smoke -- https://www.cohereboulder.org
