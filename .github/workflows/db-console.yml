name: D1 console

# The documented backstop from CLAUDE.md ("wrangler d1 execute cohere --remote
# --command ...") as a button instead of a laptop command — nobody needs
# wrangler login locally just to read or fix a row. Manual dispatch only;
# only repo collaborators with Actions access can run it.

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SQL to run against the cohere D1 database"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Execute
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute cohere --remote --command "${{ github.event.inputs.sql }}"
