name: diag roster (temporary, read-only)
on:
  push:
    branches: ["diag/roster"]
jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - name: Probe service-token standing (no mutations)
        env:
          TOKEN: ${{ secrets.REGENOS_SERVICE_TOKEN }}
        run: |
          SCENE=did:plc:w54s52ycbw5lreyhlzexredb
          B=https://scenius.social/xrpc
          echo "== deleteEvent on a nonexistent rkey (404 = authorised; Forbidden/NotAuthorized = standing lost)"
          curl -s -w "  HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d "{\"authority\":\"$SCENE\",\"rkey\":\"ev-diag-does-not-exist\"}" "$B/social.scenius.deleteEvent"
          echo; echo "== deleteEvent with NO token (baseline)"
          curl -s -w "  HTTP %{http_code}\n" -X POST -H "content-type: application/json" \
            -d "{\"authority\":\"$SCENE\",\"rkey\":\"ev-diag-does-not-exist\"}" "$B/social.scenius.deleteEvent"
          echo; echo "== getSession with token"
          curl -s -w "  HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" "$B/social.scenius.getSession" | head -c 600
          echo; echo "== getSceneMembers with a garbage token"
          curl -s -w "  HTTP %{http_code}\n" -H "Authorization: Bearer rsat_garbage" "$B/social.scenius.getSceneMembers?scene=$SCENE" | head -c 400
