name: Deploy staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: worker-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: bash scripts/ci-e2e.sh
      - name: Apply staging migrations only
        run: npx wrangler d1 migrations apply cohere-staging --config wrangler.staging.jsonc --remote
      # Uses the installed wrangler 4.118.0; uploads no Worker secrets.
      - run: npm run deploy:staging
      - run: npm run smoke -- https://cohere-signup-staging.unforced.workers.dev
      - run: node scripts/staging-smoke.mjs https://cohere-signup-staging.unforced.workers.dev
